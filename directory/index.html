<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Backus Agency Directory</title>
  <meta name="description" content="Internal directory of Backus Agency subdomains." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #141414;
      --panel-2: #1a1a1a;
      --line: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #a1a1aa;
      --primary: #11ff03;
      --primary-2: #10b981;
      --secondary: #7000ff;
      --secondary-2: #8b5cf6;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Montserrat", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }

    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: 0.6;
    }

    .orb {
      position: absolute;
      width: 55vw;
      height: 55vw;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.45;
      animation: pulse 12s ease-in-out infinite;
    }

    .orb.primary {
      background: radial-gradient(circle, rgba(17, 255, 3, 0.25) 0%, rgba(17, 255, 3, 0) 70%);
      top: -25%;
      left: -15%;
    }

    .orb.secondary {
      background: radial-gradient(circle, rgba(112, 0, 255, 0.3) 0%, rgba(112, 0, 255, 0) 70%);
      bottom: -30%;
      right: -20%;
      animation-delay: 2s;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    header {
      display: grid;
      gap: 16px;
      margin-bottom: 28px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .title {
      font-size: clamp(2.3rem, 4vw, 3.5rem);
      line-height: 1.05;
      font-weight: 800;
    }

    .title span {
      color: var(--primary);
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 760px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .pill {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 600;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin: 26px 0 20px;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
    }

    .search span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .search input {
      border: none;
      outline: none;
      font-size: 1rem;
      width: 100%;
      font-family: inherit;
      background: transparent;
      color: var(--text);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .filter-btn {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, rgba(17, 255, 3, 0.2), rgba(112, 0, 255, 0.25));
      color: #fff;
      border-color: rgba(17, 255, 3, 0.4);
    }

    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      display: grid;
      gap: 10px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 10% 10%, rgba(17, 255, 3, 0.15), transparent 55%);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.6);
    }

    .card:hover::after {
      opacity: 1;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--primary);
    }

    .tag.alt {
      color: var(--secondary-2);
    }

    .name {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .url {
      font-size: 0.92rem;
      color: var(--muted);
      word-break: break-all;
    }

    .desc {
      font-size: 0.92rem;
      color: var(--muted);
      min-height: 40px;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .open-link {
      text-decoration: none;
      color: #0b0b0b;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .chip {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      background: rgba(112, 0, 255, 0.15);
      color: var(--secondary-2);
      font-weight: 700;
    }

    .empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
    }

    @media (max-width: 760px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .filters {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb primary"></div>
    <div class="orb secondary"></div>
  </div>

  <div class="page">
    <header>
      <div class="eyebrow">Internal Directory</div>
      <div class="title">Backus Agency <span>Network</span></div>
      <div class="subtitle">
        A curated map of our active subdomains. Access is intended for internal members only and should be protected by the Authgear universal auth gateway.
      </div>
      <div class="meta-row">
        <span class="pill">Internal</span>
        <span class="pill">Authgear Protected</span>
        <span class="pill" id="total-count">0 services</span>
      </div>
    </header>

    <section class="controls">
      <label class="search">
        <span>Search</span>
        <input id="search" type="search" placeholder="Filter by name, URL, or tag" />
      </label>
      <div class="filters" id="filters"></div>
    </section>

    <section>
      <div class="grid" id="cards"></div>
      <div class="empty" id="empty" hidden>No matches. Try a different search or filter.</div>
    </section>
  </div>

  <script>
    const services = [
      {
        name: "Backus Agency",
        url: "https://backus.agency",
        category: "Public",
        tag: "Main",
        description: "Main marketing site and brand home base."
      },
      {
        name: "www",
        url: "https://www.backus.agency",
        category: "Public",
        tag: "Alias",
        description: "WWW alias for the main website."
      },
      {
        name: "Agent Zero",
        url: "https://agent.backus.agency",
        category: "Apps",
        tag: "AI",
        description: "Agent Zero interface and services."
      },
      {
        name: "N8N",
        url: "https://n8n.backus.agency",
        category: "Apps",
        tag: "Automation",
        description: "Workflow automation and integration hub."
      },
      {
        name: "N8N (mTLS)",
        url: "https://n8n-mtls.backus.agency",
        category: "Infra",
        tag: "mTLS",
        description: "mTLS-protected N8N endpoint."
      },
      {
        name: "NocoDB",
        url: "https://noco.backus.agency",
        category: "Apps",
        tag: "Data",
        description: "No-code database and internal ops tooling."
      },
      {
        name: "Mic",
        url: "https://mic.backus.agency",
        category: "Apps",
        tag: "Voice",
        description: "Microphone capture service endpoint."
      },
      {
        name: "STT",
        url: "https://stt.backus.agency",
        category: "Apps",
        tag: "Voice",
        description: "Speech-to-text gateway and services."
      },
      {
        name: "BookEnds",
        url: "https://bookends.backus.agency",
        category: "Apps",
        tag: "Product",
        description: "BookEnds application and customer portal."
      },
      {
        name: "Plane",
        url: "https://plane.backus.agency",
        category: "Apps",
        tag: "PM",
        description: "Project planning and product operations."
      },
      {
        name: "Plane MCP",
        url: "https://plane-mcp.backus.agency",
        category: "Infra",
        tag: "MCP",
        description: "Plane MCP integration endpoint."
      },
      {
        name: "Authgear",
        url: "https://auth.backus.agency",
        category: "Auth",
        tag: "SSO",
        description: "Primary Authgear tenant for identity."
      },
      {
        name: "Authgear Admin",
        url: "https://auth-admin.backus.agency",
        category: "Auth",
        tag: "Admin",
        description: "Authgear admin portal."
      },
      {
        name: "Authgear Admin (mTLS)",
        url: "https://auth-admin-mtls.backus.agency",
        category: "Auth",
        tag: "mTLS",
        description: "mTLS-protected admin access."
      },
      {
        name: "Search",
        url: "https://search.backus.agency",
        category: "Search",
        tag: "Search",
        description: "Primary internal search UI."
      },
      {
        name: "Mail",
        url: "https://mail.backus.agency",
        category: "Comms",
        tag: "Email",
        description: "Mail portal and mailbox management."
      },
      {
        name: "Traefik",
        url: "https://traefik.backus.agency",
        category: "Infra",
        tag: "Edge",
        description: "Traffic router and dashboard."
      },
      {
        name: "Social Genius",
        url: "https://app.social-genius.com",
        category: "Apps",
        tag: "Partner",
        description: "Social Genius application endpoint."
      }
    ];

    const categories = ["All", ...new Set(services.map((service) => service.category))];
    const filters = document.getElementById("filters");
    const cards = document.getElementById("cards");
    const empty = document.getElementById("empty");
    const search = document.getElementById("search");
    const totalCount = document.getElementById("total-count");

    let activeCategory = "All";
    let query = "";

    function renderFilters() {
      filters.innerHTML = "";
      categories.forEach((category) => {
        const button = document.createElement("button");
        button.className = "filter-btn" + (category === activeCategory ? " active" : "");
        button.textContent = category;
        button.type = "button";
        button.addEventListener("click", () => {
          activeCategory = category;
          renderFilters();
          renderCards();
        });
        filters.appendChild(button);
      });
    }

    function renderCards() {
      const filtered = services.filter((service) => {
        const matchesCategory = activeCategory === "All" || service.category === activeCategory;
        const haystack = `${service.name} ${service.url} ${service.tag} ${service.category}`.toLowerCase();
        const matchesQuery = haystack.includes(query.toLowerCase());
        return matchesCategory && matchesQuery;
      });

      cards.innerHTML = "";
      totalCount.textContent = `${filtered.length} services`;

      if (filtered.length === 0) {
        empty.hidden = false;
        return;
      }

      empty.hidden = true;

      filtered.forEach((service) => {
        const card = document.createElement("article");
        card.className = "card";

        const tagClass = service.tag === "mTLS" ? "tag alt" : "tag";

        card.innerHTML = `
          <div class="card-top">
            <span class="${tagClass}">${service.tag}</span>
            <span class="chip">${service.category}</span>
          </div>
          <div class="name">${service.name}</div>
          <div class="url">${service.url}</div>
          <div class="desc">${service.description}</div>
          <div class="card-actions">
            <a class="open-link" href="${service.url}" target="_blank" rel="noreferrer">Open</a>
          </div>
        `;

        cards.appendChild(card);
      });
    }

    search.addEventListener("input", (event) => {
      query = event.target.value.trim();
      renderCards();
    });

    renderFilters();
    renderCards();
  </script>
</body>
</html>
